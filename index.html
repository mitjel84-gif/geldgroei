try{let saved=JSON.parse(localStorage.getItem('geldgroei-v3')||'null');if(saved){if(['nl','pap'].includes(saved.lang))state.lang=saved.lang;if(Number.isInteger(saved.active)&&saved.active>=0&&saved.active<12)state.active=saved.active;if(Array.isArray(saved.completed))state.completed=saved.completed.filter(n=>Number.isInteger(n)&&n>=0&&n<12);if(saved.values&&typeof saved.values==='object'){for(let k in defaults){if(k in saved.values&&typeof saved.values[k]===typeof defaults[k])state.values[k]=saved.values[k]}}}}catch(e){}
const T=k=>CONTENT.copy[state.lang][k]??CONTENT.copy.nl[k]??k;
const L=()=>CONTENT.lessons[state.lang][state.active];
const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const fmt=n=>new Intl.NumberFormat('nl-NL',{maximumFractionDigits:1}).format(n);
const pct=n=>`${n>0?'+':''}${fmt(n)}%`;
const safe=(n,min,max)=>Math.max(min,Math.min(max,Number(n)||0));
function save(){try{localStorage.setItem('geldgroei-v3',JSON.stringify({lang:state.lang,active:state.active,completed:state.completed,values:state.values}))}catch(e){}}
function count(){return state.completed.length;}
function level(){let n=count();return T(n>=12?'level4':n>=8?'level3':n>=4?'level2':'level1');}
function slider(k,label,min,max,step=1,unit='euro'){let v=state.values[k];return `<div class="control"><label for="v-${k}"><span>${label}</span><strong data-readout="${k}">${display(k,unit)}</strong></label><input id="v-${k}" type="range" data-control="${k}" data-unit="${unit}" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;}
function display(k,unit){let v=state.values[k];return unit==='euro'?money(v):unit==='percent'?`${v}%`:unit==='negative'?`−${v}%`:unit==='year'?`${v} ${T('yr')}`:unit==='months'?`${v} ${T('month')}`:String(v)}
function choose(k,choices){return `<div class="choiceBar">${choices.map(({v,label})=>`<button type="button" class="choice" data-choice="${k}" data-value="${v}" aria-pressed="${String(state.values[k])===String(v)}">${label}</button>`).join('')}</div>`;}
function metrics(arr){return `<div class="metrics">${arr.map((x,i)=>`<div class="metric ${x.negative?'loss':x.positive?'profit':''}"><small>${x.label}</small><b>${x.value}</b></div>`).join('')}</div>`;}
function note(s,type='info'){return `<div class="${type}">${s}</div>`;}
function makeGraph(values,own=null,caption=''){let w=600,h=230,px=32,padR=10,top=16,btm=26,ys=[...values,...(own||[]),0],mx=Math.max(1,...ys)*1.12;const X=i=>px+(w-px-padR)*(values.length<=1?.5:i/(values.length-1));const Y=v=>h-btm-(v/mx)*(h-top-btm);let path=arr=>arr.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');let guides=Array.from({length:4},(_,i)=>{let y=top+i*(h-top-btm)/3;return `<line x1="${px}" x2="${w-padR}" y1="${y}" y2="${y}" stroke="#dee7de"/><text x="${w-padR}" y="${y-4}" font-size="10" text-anchor="end" fill="#718b7b">${money(mx*(1-i/3))}</text>`;}).join('');let d=path(values),fill=d+` L${X(values.length-1)},${h-btm} L${X(0)},${h-btm} Z`;
return `<svg class="graphic" role="img" aria-label="${caption}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="graphfill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#96d5ab" stop-opacity=".45"/><stop offset="1" stop-color="#96d5ab" stop-opacity="0"/></linearGradient></defs>${guides}<path d="${fill}" fill="url(#graphfill)"/>${own?`<path d="${path(own)}" stroke="#acb7aa" fill="none" stroke-width="3" stroke-dasharray="8 6"/>`:''}<path d="${d}" stroke="#0e8961" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(values.length-1)}" cy="${Y(values.at(-1))}" r="5" fill="#0d8564" stroke="#fff" stroke-width="2"/><text x="${px}" y="${h-4}" font-size="12" fill="#768e7c">${caption.split('→')[0]||''}</text><text x="${w-padR}" y="${h-4}" font-size="12" fill="#768e7c" text-anchor="end">${caption.split('→')[1]||''}</text></svg>`;
}
function cardsYears(){return `<div class="yearBadges">${MEESMAN_YEARS.map(y=>`<div class="yearBadge ${y.r<0?'down':''}"><small>${y.year}</small><strong>${pct(y.r)}</strong></div>`).join('')}</div>`;}
function sourceMini(){return `<a href="#sources" data-sources="true">${T('learnMore')} ↗</a>`;}
function sceneControls(n){let s='';switch(n){

case 1:s=`<div class="threeEmoji" aria-hidden="true">🏢 ⚖️ 🏢</div>`+slider('a',state.lang==='nl'?'Bedrijf A groeit of daalt':'Empresa A ta subi òf baha',-80,80,5,'percent')+slider('b',state.lang==='nl'?'Bedrijf B groeit of daalt':'Empresa B ta subi òf baha',-80,80,5,'percent');break;
case 2:s=`<div class="threeEmoji" aria-hidden="true">📉 💸 ⚠️</div>`+slider('crash',state.lang==='nl'?'Hoeveel daalt de beurs?':'Kuantu bolsa ta baha?',0,90,5,'negative');break;

case 4:s=`<div class="control"><label for="v-start">${T('startYear')}</label><select id="v-start" data-control="start">${Array.from({length:16},(_,i)=>2010+i).map(y=>`<option value="${y}" ${state.values.start===y?'selected':''}>${y}</option>`).join('')}</select></div>`+`<div class="control"><label for="v-end">${T('endYear')}</label><select id="v-end" data-control="end">${Array.from({length:2026-state.values.start},(_,i)=>state.values.start+i).map(y=>`<option value="${y}" ${state.values.end===y?'selected':''}>${y}</option>`).join('')}</select></div>`+slider('initial',T('once'),0,5000,250)+slider('monthly',T('monthly'),0,500,25);break;
case 5:s=`<div class="smallCaps">${state.lang==='nl'?'Maart 2020: de koers is gedaald':'Mart 2020: e preis a baha'}</div>`+choose('action',[{v:'sell',label:'😰 '+T('choiceSell')},{v:'hold',label:'🧘 '+T('choiceHold')},{v:'buy',label:'🪙 '+T('choiceBuy')}]);break;
case 6:s=`<div class="smallCaps">${T('horizon')}</div>`+choose('riskYears',[{v:1,label:'1 '+T('yr')},{v:3,label:'3 '+T('yr')},{v:5,label:'5 '+T('yr')},{v:10,label:'10 '+T('yr')}]);break;
case 7:s=slider('feeMonth',T('monthly'),50,500,25)+slider('feeYears',T('horizon'),5,40,1,'year');break;
case 8:s=slider('inflYears',T('horizon'),1,40,1,'year')+`<div class="smallCaps">${state.lang==='nl'?'Veronderstelde inflatie per jaar':'Inflashon imaginario pa aña'}</div>`+choose('infl',[{v:2,label:'2%'},{v:3,label:'3%'},{v:5,label:'5%'}]);break;
case 9:s=slider('expenses',T('expenses'),500,3500,100)+slider('reserves',T('reserves'),0,15000,250);break;
case 10:s=`<div class="threeEmoji" aria-hidden="true">🌍 🏭 🏢 🌱</div>`+slider('marketDrop',T('marketDrop'),0,60,5,'negative');break;
case 11:s=`<div class="smallCaps">${T('readiness')}</div>`+[1,2,3].map(i=>`<label class="checkline"><input type="checkbox" data-check="${i-1}" ${state.values.checks[i-1]?'checked':''}><span>${T('buffer'+i)}</span></label>`).join('');break;
}return s+`<div id="sceneOutput" class="result" aria-live="polite"></div>`;}
function calculateTime(){const v=state.values,records=IWDA_SERIES.filter(x=>x.year>=v.start&&x.year<=v.end);let shares=0,own=0,series=[],inleg=[];records.forEach((x,i)=>{let add=v.monthly+(i===0?v.initial:0);shares+=add/x.price;own+=add;series.push(shares*x.price);inleg.push(own)});return {records,series,inleg,value:series.at(-1)||0,own};}
function renderOutput(){let n=state.active,v=state.values,s='';switch(n){
case 0:{const toy=[-12,18,7,-20,24,4,10,-8,17,5];let savings=v.amount*1.015**v.saveYears,invest=v.amount;for(let i=0;i<v.saveYears;i++)invest*=1+toy[i]/100;s=metrics([{label:T('fixed'),value:money(savings)},{label:T('invest'),value:money(invest),negative:invest<v.amount,positive:invest>=v.amount}])+note(T('sample'),'warn');break;}
case 1:{let a=50*(1+v.a/100),b=50*(1+v.b/100),total=a+b;s=metrics([{label:state.lang==='nl'?'Bedrijf A + B, samen':'Empresa A + B, huntu',value:money(total),negative:total<100},{label:T('pnl'),value:`${pct(total-100)}`,negative:total<100,positive:total>=100}])+`<div class="strip"><span style="width:${safe(total/180*100,0,100)}%"></span></div>`+note(state.lang==='nl'?'Bij twee gelijke beleggingen telt het gemiddelde. Echte indexfondsen wegen bedrijven vaak verschillend.':'Ku dos invershon pareu, e promedio ta konta. Den fondo real nan no ta semper pareu.');break;}
case 2:{let after=1000*(1-v.crash/100),recover=v.crash===100?Infinity:100*v.crash/(100-v.crash);s=metrics([{label:state.lang==='nl'?'Nog over van €1.000':'Resta di €1.000',value:money(after),negative:after<1000},{label:state.lang==='nl'?'Stijging nodig om te herstellen':'Subida pa recuperá',value:`+${fmt(recover)}%`}])+`<div class="strip"><span style="width:${100-v.crash}%"></span></div>`+note(state.lang==='nl'?'Herstel kan lang duren en is nooit gegarandeerd.':'Recuperashon por dura hopi i no ta garantisá.','warn');break;}
case 3:{let invested=0,own=0,values=[0],owns=[0],r=(1+v.rate/100)**(1/12)-1;for(let m=1;m<=v.years*12;m++){invested=invested*(1+r)+v.monthly;own+=v.monthly;if(m%Math.max(1,Math.floor(v.years*12/24))===0||m===v.years*12){values.push(invested);owns.push(own)}}s=metrics([{label:T('yourOwn'),value:money(own)},{label:T('final'),value:money(invested),negative:invested<own,positive:invested>own}])+makeGraph(values,owns,`0→${v.years} ${T('yr')}`)+`<div class="chartLegend"><span><i></i> ${T('market')}</span><span><i class="dashed"></i> ${T('yourOwn')}</span></div>`+note(state.lang==='nl'?'Een vast gemiddeld rendement per jaar is een rekenaanname. Echte koersen schommelen en kosten, belastingen en inflatie tellen ook mee.':'Rendimiento konstant ta un suposishon. Preisnan real ta subi i baha; kostonan, impuesto i inflashon tambe ta konta.','warn');break;}
case 4:{let c=calculateTime();s=metrics([{label:T('yourOwn'),value:money(c.own)},{label:T('final'),value:money(c.value),negative:c.value<c.own,positive:c.value>c.own}])+`<div class="headingRow"><span class="tiny">IWDA.AS · ${v.start}–${v.end}</span><b class="${c.value<c.own?'':'smallCaps'}">${money(c.value-c.own)}</b></div>`+makeGraph(c.series,c.inleg,`${v.start}→${v.end}`)+`<div class="chartLegend"><span><i></i> ${T('market')}</span><span><i class="dashed"></i> ${T('yourOwn')}</span></div>`+note(T('separate')+' '+(state.lang==='nl'?'Elke maand is één aankoop tegen de geregistreerde maandkoers aangenomen; fracties van een aandeel zijn toegestaan. Geen persoonlijke aankoopkosten, belasting of inflatie.':'Un kumpra pa luna segun e preis mensual; parti di akshon ta posibel. Sin kostonan personal, impuesto òf inflashon.'),'warn')+`<div class="smallCaps" style="margin-top:12px">${T('meesR')}</div>`+cardsYears();break;}
case 5:{const pJan=56.69,pMar=46.14,pDec=59.59,units=1000/pJan,atMarch=units*pMar,extra=v.action==='buy'?200:0,final=v.action==='sell'?atMarch:units*pDec+(extra/pMar)*pDec,own=1000+extra;s=metrics([{label:state.lang==='nl'?'Waarde in maart 2020':'Balor na mart 2020',value:money(atMarch),negative:true},{label:state.lang==='nl'?'Waarde eind 2020 (volgens jouw keuze)':'Balor fin di 2020',value:money(final),negative:final<own,positive:final>own}])+note((v.action==='buy'?(state.lang==='nl'?'Je hebt in maart €200 extra ingelegd. ':'Bo a invertí €200 ekstra na mart. '):'')+`${T('yourOwn')}: ${money(own)}. `+T('notFuture'),'warn')+`<div class="tiny">IWDA.AS · Jan: €56,69 · Mrt: €46,14 · Dec: €59,59. ${state.lang==='nl'?'Model met één aankoop in januari; bij verkopen blijft de opbrengst als contant geld staan. Zonder belasting en transactiekosten.':'Un kompra na yanüari; despues di bende e plaka ta keda kontant. Sin impuesto i kosto.'}</div>`;break;}
case 6:{let periods=v.riskYears*12,tot=0,loss=0,minRet=Infinity;for(let i=0;i+periods<IWDA_SERIES.length;i++){tot++;let ret=IWDA_SERIES[i+periods].price/IWDA_SERIES[i].price-1;if(ret<0)loss++;minRet=Math.min(ret,minRet);}let p=100*loss/tot;s=metrics([{label:state.lang==='nl'?'Verliesperioden / alle gemeten':'Periodo di pèrdida / total',value:`${loss} / ${tot}`},{label:state.lang==='nl'?'Historisch aandeel met verlies':'Parti histórico ku pèrdida',value:`${fmt(p)}%`,negative:true}])+`<div class="strip"><span style="width:${100-p}%"></span></div>`+note(T('riskScope')+' '+(state.lang==='nl'?'Het fonds kan sterk dalen; bij een wereldfonds is verlies van álles een uitzonderlijk scenario, maar geen exact getal kan worden gegeven voor de kans daarop.':'Un fondo mundial por baha hopi; perde tur plaka ta un scenario ekstremo, pero nos no por duna un porsentahe eksakto. '),'warn')+`<div class="tiny">${state.lang==='nl'?'Geen van de gebruikte maandkoersen is nul. Dat maakt de kans op totaalverlies niet meetbaar of onmogelijk. Waargenomen IWDA.AS maandkoersen 2010–2025, per startmaand vergeleken met dezelfde maand 1/3/5/10 jaar later.':'Ningun di e preisnan mensual tabata sero. Esey no ta hasi pèrdida total imposibel. Preisnan IWDA.AS 2010–2025, kompará ku e mesun luna varios aña despues.'}</div>`;break;}
case 7:{let gross=1.06,net0=Math.pow(gross*(1-.004),1/12),net1=Math.pow(gross*(1-.015),1/12);let low=0,high=0;for(let i=0;i<v.feeYears*12;i++){low=low*net0+v.feeMonth*.998;high=high*net1+v.feeMonth*.998;}s=metrics([{label:'0,4% '+T('fee'),value:money(low)},{label:'1,5% '+T('fee')+' · '+(state.lang==='nl'?'hypothetisch':'hipotétiko'),value:money(high)}])+`<div class="bigNumber">${money(low-high)}</div><div class="tiny">${state.lang==='nl'?'Verschil in eindwaarde door jaarlijkse fondskosten in dit model':'Diferensia na final pa motibu di kosto anual den e modelo aki'}</div>`+note(T('feeExample'),'warn');break;}
case 8:{let actual=100/(1+v.infl/100)**v.inflYears,needed=100*(1+v.infl/100)**v.inflYears;s=metrics([{label:T('currentMoney'),value:money(actual)},{label:T('needMoney'),value:money(needed)}])+note(state.lang==='nl'?'Dit is een vaste, verzonnen inflatie. De inflatie kan per jaar sterk wisselen.':'Esaki ta inflashon konstant imaginario. Inflashon real por kambia tur aña.','warn');break;}
case 9:{let months=v.reserves/v.expenses;s=metrics([{label:T('monthsCovered'),value:`${fmt(months)} ${T('month')}`},{label:T('goal3'),value:money(v.expenses*3)}])+`<div class="strip"><span style="width:${safe(months/6*100,0,100)}%"></span></div><div class="tiny">${T('goal6')}: ${money(v.expenses*6)}</div>`+note(state.lang==='nl'?'3 of 6 maanden zijn alleen rekenvoorbeelden. Een passende buffer hangt af van jouw persoonlijke situatie.':'3 òf 6 luna ta solamente ehèmpel. E reserva adekuá ta dependé di bo situashon.');break;}
case 10:{let lossOne=1,market=100*(1-v.marketDrop/100);s=`<div class="minis">${Array.from({length:100},(_,i)=>`<i class="${i===0?'alert':''}"></i>`).join('')}</div>`+metrics([{label:T('singleFail'),value:money(99)},{label:T('marketDrop'),value:money(market),negative:true}])+note(state.lang==='nl'?'Vereenvoudiging: 100 bedrijven met gelijke gewichten. Echte fondsen hebben ongelijke gewichten en kunnen nog andere risico’s hebben.':'Modelo simpel: 100 empresa ku mesun peso. Fondo real tin peso diferente i otro riesgonan.')+`<div class="tiny">${state.lang==='nl'?'Meesman Aandelen Wereldwijd Totaal: duizenden aandelen, start 2019, fondskosten 0,4% en doorgaans 0,2% transactiekosten. Gemiddeld minimaal €50 per maand periodiek. Controleer de actuele voorwaarden.':'Meesman Aandelen Wereldwijd Totaal: miles di akshon, a kuminsá 2019, kosto anual 0,4% i transakshon normalmente 0,2%. Mínimo promedio €50 pa luna. Kontrolá e kondishonnan.'} ${sourceMini()}</div>`;break;}
case 11:{let done=v.checks.filter(Boolean).length;s=`<div class="bigNumber">${done} / 3</div>`+note(done===3?(state.lang==='nl'?'Je begrijpt drie belangrijke principes. De volgende stap is zelf afwegen of beleggen bij jouw situatie past.':'Bo a komprondé tres prinsipio importante. Awor bo por evalua bo propio situashon.'):(state.lang==='nl'?'Vink aan wat je al kunt uitleggen; je hoeft nergens geld voor in te leggen.':'Marka loke bo por splika; bo no tin mester di pone plaka.'))+`<p class="tiny">${T('ownMore')}</p>`;break;}
}

const instr=lang()==='nl'?`Na ${entry.year}-${String(entry.decision+1).padStart(2,'0')} reken je de gekozen actie door. Dit was geen vooraf bekend dieptepunt.`:`Despues di ${entry.year}-${String(entry.decision+1).padStart(2,'0')} nos ta kalkulá e akshon skohe. Esei no tabata un punto minimo ku nos por sa di antemano.`;
return `<h3>📉 ${f('names')[1]}</h3><p>${f('crashDesc')}</p>${options('crashCase',[['2020','2020 · COVID'],['2022','2022 · Bolsa']])}<div class="labInfo">${f('decision')}: ${entry.year}-${String(entry.decision+1).padStart(2,'0')} · ${instr}</div>${controls([['crashMonth',f('moment'),0,11,1,'index'],['crashMonthly',f('month'),0,500,25,'eur']])}${options('crashAction',[['hold',f('keep')],['sell',f('sell')],['add',f('add')]])}<div class="labNumberGrid">${badge(f('value')+` · ${data[current].date}`,euro(currentVal),currentVal<own?'bad':'good')}${badge(f('spent'),euro(own))}${badge(f('labelTotal')+' · '+f('keep'),euro(hold))}</div>${chart([{vals:basepath,color:'#7e9db2'},{vals:chosen,color:'#168762'}])}<div class="labAxis"><span><i></i>${f('decision')}</span><span><i class="three"></i>${f('keep')}</span></div><div class="labAlert">${f('replayExplain')} ${f('historical')}</div>${source('https://www.digrin.com/stocks/detail/IWDA.AS/price','IWDA.AS historische koersbron')}`}
function lossMeter(){let n=v.riskYears*12,prices=series(),loss=0,all=0;for(let i=0;i+n<prices.length;i++){all++;if(prices[i+n].price<prices[i].price)loss++}let fr=all?100*loss/all:0;return `<h3>🔎 ${f('names')[2]}</h3><p>${f('riskDesc')}</p>${options('riskYears',[[1,'1 '+f('years')],[3,'3 '+f('years')],[5,'5 '+f('years')],[10,'10 '+f('years')],[20,'20 '+f('years')]])}${all?`<div class="labNumberGrid">${badge(f('observations'),all)}${badge(f('negative'),loss,'bad')}${badge(f('frequency'),num(fr)+'%')}</div><div class="labStack"><span class="red" style="width:${fr}%"></span></div><div class="labDotGrid" aria-label="${loss} / ${all}">${Array.from({length:Math.min(100,all)},(_,i)=>`<i class="${i<Math.round(Math.min(100,all)*loss/all)?'loss':''}"></i>`).join('')}</div>`:`<div class="labAlert">${f('empty')}</div>`}<div class="labAlert">${f('riskExplain')} ${f('historical')}</div>${source('https://www.justetf.com/en-nl/etf-profile.html?isin=IE00B4L5Y983','iShares Core MSCI World / justETF')}`}
function fees(){let cheap=((1+v.feeGross/100)*(1-.004)-1)*100,exp=((1+v.feeGross/100)*(1-.015)-1)*100;let ys=[],zs=[];for(let i=0;i<=v.feeYears;i++){ys.push(annuity(v.feeMonthly,i,cheap));zs.push(annuity(v.feeMonthly,i,exp))}let a=ys.at(-1),b=zs.at(-1);return `<h3>🪙 ${f('names')[3]}</h3><p>${f('feeDesc')}</p>${controls([['feeMonthly',f('month'),25,500,25,'eur'],['feeYears',f('period'),5,40,1,'years']])}${options('feeGross',[[2,'2%'],[6,'6%'],[8,'8%']])}<div class="labNumberGrid">${badge(f('feeLow'),euro(a),'good')}${badge(f('feeHigh'),euro(b))}${badge(f('feeGap'),euro(a-b))}</div>${chart([{vals:ys,color:'#148262'},{vals:zs,color:'#dba04a'}])}<div class="labAxis"><span><i></i>${f('feeLow')}</span><span><i class="two"></i>${f('feeHigh')}</span></div><div class="labAlert">${f('feeExplain')} ${f('model')}</div>${source('https://www.meesman.nl/zo-werkt-het/kosten/','Meesman kosten')}`}
function goal(){let target=v.goalTarget*Math.pow(1.02,v.goalYears),req=required(target,v.goalYears,v.goalRate,v.goalNow),bad=annuity(req,v.goalYears,-2,v.goalNow);return `<h3>🏡 ${f('names')[4]}</h3><p>${f('goalDesc')}</p>${options('goalKind',[['house','🏠 '+f('goalHouse')],['trip','✈️ '+f('goalTrip')],['later','🌳 '+f('goalLater')]])}${controls([['goalTarget',f('goalAmount'),5000,150000,5000,'eur'],['goalNow',f('already'),0,20000,500,'eur'],['goalYears',f('period'),2,40,1,'years']])}${options('goalRate',[[-2,'−2%'],[4,'+4%'],[7,'+7%']])}<div class="labNumberGrid">${badge(f('futureGoal'),euro(target))}${badge(f('needMonthly'),euro(req),'good')}${badge(f('badScenario'),euro(bad),'bad')}</div><div class="labAlert">${f('goalExplain')} ${f('model')}</div>`}
function emergency(){let cost=v.emergency==='washer'?900:v.emergency==='car'?2500:2*v.expense,left=v.buffer-cost;return `<h3>🛟 ${f('names')[5]}</h3><p>${f('bufferDesc')}</p>${controls([['expense',f('living'),500,4000,100,'eur'],['buffer',f('cash'),0,20000,250,'eur']])}<div class="labBoxArt" aria-hidden="true">🧺 🔧 🚗 🧾 🛟</div>${options('emergency',[['washer',f('broken')],['car',f('car')],['job',f('job')]])}<div class="labNumberGrid">${badge(f('needed'),euro(cost))}${badge(f('left'),euro(left),left<0?'bad':'good')}${badge(f('cover'),num(v.buffer/v.expense)+' '+(lang()==='nl'?'maanden':'luna'))}</div><div class="labStack"><span class="${left<0?'red':''}" style="width:${clamp((v.buffer/Math.max(cost,1))*100,0,100)}%"></span></div><div class="${left<0?'labAlert':'labInfo'}">${left>=0?f('bufferYes'):f('bufferNo')}</div><div class="labInfo">${f('bufferExplain')}</div>${source('https://bufferberekenaar.nibud.nl/','Nibud · financiële buffer')}`}
const myths={nl:[['Als je wereldwijd belegt, kun je geen verlies maken.',false,'Ook een wereldfonds kan flink dalen als aandelenmarkten dalen.'],['Alle bedrijven moeten zakken voordat je fonds verlies heeft.',false,'Een grote daling van enkele zwaarwegende bedrijven kan de totale waarde doen dalen.'],['Een goede financiële buffer hoort bij verantwoord beleggen.',true,'Geld voor onverwachte uitgaven wil je meestal direct beschikbaar houden.'],['Een hoger rendement is altijd gegarandeerd na twintig jaar.',false,'Ook lange perioden geven geen garantie op winst.'],['Jaarlijkse fondskosten kunnen op lange termijn veel verschil maken.',true,'Kosten worden herhaaldelijk betaald en remmen samengestelde groei.'],['Als een aandeel 50% daalt, is 50% stijging genoeg om terug te komen.',false,'Na 50% verlies is 100% stijging nodig om terug te keren.'],['Geld dat je binnenkort nodig hebt, past vaak beter op een spaarrekening.',true,'Bij een korte horizon kan een koersdaling precies op het verkeerde moment komen.'],['Maandelijks inleggen voorkomt verlies volledig.',false,'Regelmatig investeren spreidt koopmomenten, maar verlies blijft mogelijk.'],['De historische verliesfrequentie is dezelfde als de kans op verlies morgen.',false,'Historische perioden zijn geen exacte voorspelling voor toekomstige uitkomsten.'],['Bij een wereldwijd indexfonds kies je niet elk bedrijf afzonderlijk.',true,'Je koopt via één fonds een mandje met veel bedrijven.']],pap:[['Si bo invertí den henter mundu, bo no por pèrdè.',false,'Un fondo mundial por baha hopi ora bolsanan ta baha.'],['Tur empresa mester baha promé ku bo fondo por pèrdè.',false,'Un pèrdida grandi di algun empresa ku hopi peso por baha e balor total.'],['Un bon reserva finansiero ta importante ora bo ta invertí.',true,'Plaka pa gastunan inesperá mester ta disponibel.'],['Despues di binti aña, ganashi ta garantisá.',false,'Ni un periodo largu ta garantisá ganashi.'],['Gastunan anual di fondo por hasi hopi diferensia den tempu.',true,'Gastunan ta reducí e kresementu kumponé.'],['Si un akshon baha 50%, subi 50% ta sufisiente pa bolbe.',false,'Despues di 50% pèrdida, bo mester 100% subida pa bolbe.'],['Plaka ku bo mester pronto ta frequentemente mihó den spaarrekening.',true,'Den un tempu kortiku e bolsa por baha na momento malu.'],['Pone plaka tur luna ta kita tur riesgo di pèrdida.',false,'Invershon regular ta parti e momentonan, pero riesgo ta keda.'],['Frekuensia históriko di pèrdida ta meskos ku posibilidat pa mañan.',false,'Historia no por predikí e resultado futuro eksakto.'],['Ku un fondo mundial bo no tin mester di skohe kada empresa.',true,'Bo ta kumpra un grupo grandi di empresa via un fondo.']]};
function facts(){let questions=myths[lang()],keys=Object.keys(v.mythAnswers),correct=keys.filter(k=>v.mythAnswers[k]===questions[+k][1]).length,idx=clamp(v.mythIndex,0,questions.length-1),cur=questions[idx],ans=v.mythAnswers[idx];return `<h3>🧠 ${f('names')[6]}</h3><p>${f('mythDesc')}</p><div class="labInfo">${idx+1} / ${questions.length} · ${f('score')}: ${correct} / ${keys.length}</div><div class="labQuestion" style="margin-top:13px"><h4>${cur[0]}</h4>${[[true,f('true')],[false,f('false')]].map(([val,label])=>`<button type="button" data-lab-myth="${val}" aria-pressed="${ans===val}">${label}</button>`).join('')}${ans!==undefined?`<div class="${ans===cur[1]?'labInfo':'labAlert'}">${ans===cur[1]?f('good'):f('notQuite')} ${cur[2]}</div>`:''}</div><div class="labNext"><button class="labButton" data-lab-move="-1" ${idx===0?'disabled':''}>${f('prev')}</button><button class="labButton solid" data-lab-move="1" ${idx===questions.length-1?'disabled':''}>${f('next')}</button><button class="labButton" data-lab-action="resetmyths">↻ ${f('again')}</button></div>`}
function daily(){let d=new Date(),day=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,seed=Number(day.replaceAll('-','')),which=seed%myths.nl.length,q=myths[lang()][which],ans=v.dailyAnswers[day];return `<h3>✨ ${f('names')[7]}</h3><p>${f('dailyDesc')}</p><div class="labQuestion"><div class="labAchievement">📅 ${day} · ${f('dayQuest')}</div><h4 style="margin-top:12px">${q[0]}</h4>${[[true,f('true')],[false,f('false')]].map(([val,label])=>`<button data-lab-daily="${val}" type="button" aria-pressed="${ans===val}">${label}</button>`).join('')}${ans!==undefined?`<div class="${ans===q[1]?'labInfo':'labAlert'}">${ans===q[1]?f('good'):f('notQuite')} ${q[2]}</div><p class="labSmall">${f('doneForToday')}</p>`:''}</div><div class="labDivider"></div><div class="labChoiceGroup"><button type="button" class="labButton" data-lab-action="speak">${f('speak')}</button><button type="button" class="labButton" data-lab-action="stop">${f('stop')}</button></div><p class="labSmall">${lang()==='pap'?f('audioPap'):f('dailyDesc')}</p><div class="labBottom"><b>${f('home')}</b><p class="labSmall">${f('homeHelp')}</p></div><div class="labNext"><a class="labButton" href="#lesson">${f('goLessons')}</a></div>`}
const labs=[saving,replay,lossMeter,fees,goal,emergency,facts,daily];
function render(){const mount=id('labMount');if(!mount)return;v.active=clamp(v.active,0,7);mount.innerHTML=`<div class="labHeader"><div><div class="labEyebrow">🧪 ${f('eyebrow')}</div><h2>${f('header')}</h2><p>${f('sub')}</p></div><span class="labAchievement">8 ${lang()==='nl'?'experimenten':'eksperimentonan'}</span></div><div class="labTabs" role="tablist" aria-label="${f('header')}">${f('names').map((name,i)=>`<button id="labtab${i}" type="button" role="tab" aria-selected="${i===v.active}" aria-controls="labPanel" data-lab-tab="${i}">${['🏦','📉','🔍','🪙','🏠','🛟','🧠','✨'][i]} ${name}</button>`).join('')}</div><div class="labCard" id="labPanel" role="tabpanel" aria-labelledby="labtab${v.active}"><div class="labNext" style="margin:0 0 12px"><button class="labButton" type="button" data-lab-action="speak">🔊 ${lang()==='nl'?'Luister naar de uitleg':'Skucha splikashon'}</button></div>${labs[v.active]()}</div><div class="labBottom"><div class="labSmall">ℹ️ ${f('note')}</div>${source('https://www.afm.nl/nl-nl/consumenten/themas/zelf-beleggen','AFM · zelf beleggen')}</div>`}
window.geldgroeiLabRender=render;
function updateResult(){render();save();}
document.addEventListener('input',e=>{let key=e.target?.dataset?.labChange;if(!key)return;v[key]=Number(e.target.value);let val=document.querySelector(`[data-lab-value="${key}"]`);if(val)val.textContent=formatSlider(key,e.target.dataset.labUnit); // retain the slider while updating the rest of the card for touch use
let sourceSlider=e.target,old=sourceSlider.value;let panel=id('labPanel');let newHTML=labs[v.active]();let temp=document.createElement('div');temp.innerHTML=newHTML;let newControl=temp.querySelector(`[data-lab-change="${key}"]`);if(newControl)newControl.value=old;
// Update results and SVG without replacing the active slider, so dragging works on phones.
for(const selector of ['.labNumberGrid','.labGraph','.labStack']){
const previous=panel.querySelectorAll(selector),updated=temp.querySelectorAll(selector);
previous.forEach((node,i)=>{if(updated[i])node.replaceWith(updated[i])});
}
save();});
document.addEventListener('change',e=>{let key=e.target?.dataset?.labChange;if(!key)return;v[key]=Number(e.target.value);updateResult()});
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.labTab!==undefined){v.active=+btn.dataset.labTab;updateResult();return}if(btn.dataset.labChoice){let key=btn.dataset.labChoice,value=btn.dataset.labSet;v[key]=typeof defaults[key]==='number'?Number(value):value;if(key==='crashCase')v.crashMonth=11;updateResult();return}if(btn.dataset.labMyth!==undefined){v.mythAnswers[v.mythIndex]=(btn.dataset.labMyth==='true');updateResult();return}if(btn.dataset.labDaily!==undefined){let d=new Date(),day=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;v.dailyAnswers[day]=btn.dataset.labDaily==='true';updateResult();return}if(btn.dataset.labMove!==undefined){v.mythIndex=clamp(v.mythIndex+Number(btn.dataset.labMove),0,9);updateResult();return}if(btn.dataset.labAction==='resetmyths'){v.mythAnswers={};v.mythIndex=0;updateResult();return}if(btn.dataset.labAction==='stop'){if('speechSynthesis' in window)window.speechSynthesis.cancel();return}if(btn.dataset.labAction==='speak'){if(!('speechSynthesis' in window)){alert(f('noSpeech'));return}window.speechSynthesis.cancel();let panel=id('labPanel'),texts=[panel?.querySelector('h3')?.textContent||f('header'),panel?.querySelector('p')?.textContent||f('sub'),panel?.querySelector('.labAlert')?.textContent||panel?.querySelector('.labInfo')?.textContent||''];let speech=new SpeechSynthesisUtterance(texts.join('. '));speech.lang=lang()==='pap'?'pap-AW':'nl-NL';speech.rate=.88;window.speechSynthesis.speak(speech);return}});
render();
function checkLabView(){let mount=id('labs');if(!mount)return;let box=mount.getBoundingClientRect();document.body.classList.toggle('labs-visible',box.top<innerHeight-100&&box.bottom>120)}
addEventListener('scroll',checkLabView,{passive:true});addEventListener('resize',checkLabView);checkLabView();
})();
