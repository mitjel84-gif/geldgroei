<div class="two blockgap"><div class="card"><h3>❓ ${t('allTitle')}</h3><p>${t('allText')}</p><div class="disclaimer">${lang==='nl'?'0 keer naar €0 in dit koersbestand is géén bewijs voor 0% toekomstig risico.':'0 biaha na €0 den e datonan aki NO ta prueba di 0% riesgo den futuro.'}</div></div><div class="card"><h3>${t('quizTitle')}</h3><p>${t('quizQuestion')}</p>${['A','B','C'].map(k=>`<button class="quizbtn" data-answer="${k}">${t('quiz'+k)}</button>`).join('')}<div class="quiz-answer ${st.quiz?'':'hidden'}" id="quizAnswer" aria-live="polite">${st.quiz?(st.quiz==='A'?t('quizRight'):t('quizWrong')):''}</div></div></div></section>
<section class="section" id="meesman"><div class="sectionintro"><span class="step">${t('meesStep')}</span><h2>${t('meesTitle')}</h2><p class="lead">${t('meesLead')}</p></div><div class="two"><div class="card"><div class="checklist">${[1,2,3,4].map(i=>`<div class="check"><span class="tick">✓</span><div><b>${t('mees'+i+'Title')}</b><small>${t('mees'+i+'Text')}</small></div></div>`).join('')}</div></div><div class="card"><h3>🧭 ${t('beforeTitle')}</h3><div class="checklist">${[1,2,3,4].map(i=>`<div class="check"><span class="tick">${i}</span><div>${t('before'+i)}</div></div>`).join('')}</div><div class="callout" style="margin-top:16px">${t('meesIndependence')}</div></div></div></section>
<section class="section" id="bronnen"><div class="sectionintro"><span class="step">${t('sourcesStep')}</span><h2>${t('sourcesTitle')}</h2><p class="lead">${t('sourcesLead')}</p></div><div class="sources">${[
 ['https://www.digrin.com/stocks/detail/IWDA.AS/price','sourcePrice'],['https://www.ishares.com/uk/individual/en/products/251882/ISHARES_MSCI_WORLD_UCITS_ETF','sourceIshares'],['https://www.meesman.nl/media/zielgcys/mp-jv-2025.pdf','sourceReturns'],['https://www.meesman.nl/veelgestelde-vragen','sourceFees'],['https://www.afm.nl/nl-nl/consumenten/themas/zelf-beleggen','sourceAfm'],['https://www.meesman.nl/onze-fondsen/aandelen-wereldwijd-totaal/','sourceFund']].map(([href,k])=>`<a target="_blank" rel="noopener noreferrer" href="${href}">${t(k)} ↗</a>`).join('')}</div><div class="disclaimer">${t('sourceFinal')}</div></section>

 attach();updateAll();

function attach(){
 $('language').onchange=e=>{stop();lang=e.target.value;try{localStorage.setItem('geldgroei-language',lang)}catch(x){}render();};
 $('one').onclick=()=>{st.single=true;renderBasket()};$('many').onclick=()=>{st.single=false;renderBasket()};
 for(const [id,k,fun] of [['company','company',renderCompany],['initial','initial',updateTime],['monthly','monthly',updateTime],['futureMonth','futureMonth',renderFuture],['futureYears','futureYears',renderFuture],['crash','crash',renderCrash]])$(id).oninput=e=>{st[k]=+e.target.value;fun()};
 $('histAmount').onchange=e=>{st.hist=+e.target.value;renderMeesman()};
 $('startYear').onchange=e=>{stop();st.start=+e.target.value;st.position=null;updateTime()};
 $('timePosition').oninput=e=>{stop();st.position=+e.target.value;updateTime()};
 $('play').onclick=()=>{if(playback){stop();return;}let n=(2025-st.start+1)*12;if(st.position===null||st.position>=n-1)st.position=0;updateTime();$('play').textContent='⏸ '+(lang==='nl'?'Pauze':'Pausa');playback=setInterval(()=>{if(st.position>=n-1){stop();return;}st.position++;updateTime();},140);};
 document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{st.rate=+b.dataset.rate;document.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderFuture();});
 document.querySelectorAll('[data-window]').forEach(b=>b.onclick=()=>{st.window=+b.dataset.window;document.querySelectorAll('[data-window]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderRisk();});
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{st.quiz=b.dataset.answer;$('quizAnswer').classList.remove('hidden');$('quizAnswer').textContent=st.quiz==='A'?t('quizRight'):t('quizWrong');});
}
function stop(){if(playback){clearInterval(playback);playback=null;}const b=$('play');if(b)b.textContent='▶ '+(lang==='nl'?'Speel jaren af':'Mira e añanan pasa');}
function renderBasket(){$('one').setAttribute('aria-pressed',st.single);$('many').setAttribute('aria-pressed',!st.single);$('companies').classList.toggle('single',st.single);$('basketInfo').textContent=st.single?t('basketSingle'):t('basketMany');}
function renderCompany(){const a=500*(1+st.company/100),sum=a+550,diff=sum-1000;$('companyOut').textContent=percent(st.company);$('companyAEnd').textContent=money(a);$('companyTotal').textContent=money(sum);$('companyExplain').textContent=(lang==='nl'?'Samen: ':'Huntu: ')+money(sum)+' · '+(Math.abs(diff)<.01?t('mixEven'):money(Math.abs(diff))+' '+t(diff>0?'mixProfit':'mixLoss'));}
function renderMeesman(){const end=MEESMAN_YEARS.reduce((v,y)=>v*(1+y.r/100),st.hist);$('histOwn').textContent=money(st.hist);$('histEnd').textContent=money(end);$('histDiff').textContent=signEuro(end-st.hist)+' · '+percent((end/st.hist-1)*100);}
// Monthly purchases happen at the recorded month price; fractions of ETF shares allowed.
function calculateTime(){const all=IWDA_SERIES.filter(x=>x.year>=st.start);const max=all.length-1;let cursor=st.position===null?max:Math.min(max,Math.max(0,st.position));st.position=cursor;let units=0,own=0,history=[];for(let i=0;i<=cursor;i++){const rec=all[i];const deposit=st.monthly+(i===0?st.initial:0);units+=deposit/rec.price;own+=deposit;history.push({date:rec.date,value:units*rec.price,own,price:rec.price});}return {all,max,cursor,history,last:history.at(-1)};}
function updateTime(){const {all,max,cursor,history,last}=calculateTime();$('initialOut').textContent=money(st.initial);$('monthlyOut').textContent=money(st.monthly);$('timePosition').max=max;$('timePosition').value=cursor;$('timePositionOut').textContent=last.date;$('timeDate').textContent=(lang==='nl'?'Waarde in ':'Balor na ')+last.date+' · iShares IWDA';$('timeEnd').textContent=money(last.value);$('timeOwn').textContent=money(last.own);$('timeDiff').textContent=signEuro(last.value-last.own);drawChart('timeChart',history.map(x=>x.value),history.map(x=>x.own),history.map(x=>x.date),true);}
function renderFuture(){let a=0,own=0,values=[0],inleg=[0],mRate=Math.pow(1+st.rate/100,1/12)-1;for(let i=1;i<=st.futureYears*12;i++){a=a*(1+mRate)+st.futureMonth*.998;own+=st.futureMonth;if(i%3===0||i===st.futureYears*12){values.push(a);inleg.push(own);}}$('futureMonthOut').textContent=money(st.futureMonth);$('futureYearsOut').textContent=st.futureYears+' '+t('unitsYears');$('futureOwn').textContent=money(own);$('futureEnd').textContent=money(a);$('futureDelta').textContent=signEuro(a-own)+' · '+(a>=own?t('timeGain'):t('timeLoss'));drawChart('futureChart',values,inleg,null,false);}
function drawChart(id,values,own,dates,history){const svg=$(id);if(!svg||!values.length)return;const W=540,H=240,L=28,R=16,T=15,B=36;const max=Math.max(...values,...own,1)*1.13;const x=i=>L+(W-L-R)*(values.length===1?.5:i/(values.length-1));const y=v=>H-B-(v/max)*(H-T-B);const path=arr=>arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(2)+' '+y(v).toFixed(2)).join(' ');const axis=Array.from({length:4},(_,i)=>{const yy=T+(H-T-B)*i/3;return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#dfebe1"/><text x="${W-R}" y="${yy-4}" font-size="10" text-anchor="end" fill="#7a9082">${money(max*(1-i/3)/1.13)}</text>`}).join('');const area=path(values)+` L${x(values.length-1)} ${H-B} L${x(0)} ${H-B} Z`;const first=history?(dates[0]||'').slice(0,4):'0';const last=history?(dates.at(-1)||'').slice(0,4):String(st.futureYears);svg.innerHTML=`<defs><linearGradient id="area-${id}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a7dbb4" stop-opacity=".48"/><stop offset="1" stop-color="#a7dbb4" stop-opacity="0"/></linearGradient></defs>${axis}<path d="${area}" fill="url(#area-${id})"/><path d="${path(own)}" stroke="#b5bdae" stroke-width="2.8" stroke-dasharray="6 5" fill="none"/><path d="${path(values)}" stroke="#117c65" stroke-width="3.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(values.length-1)}" cy="${y(values.at(-1))}" r="5.5" fill="#117c65" stroke="#fff" stroke-width="2"/><text x="${L}" y="${H-9}" font-size="12" fill="#6e8376">${first}</text><text x="${W-R}" y="${H-9}" text-anchor="end" font-size="12" fill="#6e8376">${last}</text>`;}
function renderRisk(){const n=st.window*12;let loss=0,all=0;for(let i=0;i+n<IWDA_SERIES.length;i++){all++;if(IWDA_SERIES[i+n].price<IWDA_SERIES[i].price)loss++;}const p=all?loss/all*100:0;$('lossN').textContent=String(loss);$('totalN').textContent=String(all);$('lossPct').textContent=number(p)+'%';$('goodBar').style.width=(100-p)+'%';$('riskResult').textContent=(lang==='nl'?`${all-loss} van de ${all} gemeten perioden eindigden gelijk of hoger.`:`${all-loss} di e ${all} periodonan tabata meskos òf mas haltu na final.`);}
function renderCrash(){const c=st.crash;$('crashOut').textContent='−'+c+'%';$('crashLeft').textContent=money(1000*(1-c/100));$('crashRecover').textContent='+'+number(c/(100-c)*100)+'%';$('crashBar').style.width=(100-c)+'%';}
function updateAll(){renderBasket();renderCompany();renderMeesman();updateTime();renderFuture();renderRisk();renderCrash();}
render();
})();

</script>
